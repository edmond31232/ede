<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>דגי-פרצופים: משחק קליל</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 20% 10%, #1e4e77, #07263d 60%);
      color: #fff;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .app {
      width: min(980px, 96vw);
      display: grid;
      gap: 14px;
    }
    .panel {
      background: rgba(9, 23, 37, 0.72);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    label { font-size: 14px; opacity: 0.9; }
    input[type="file"] { max-width: 180px; }
    button {
      background: #2f89d9;
      border: 0;
      border-radius: 10px;
      color: #fff;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 600;
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.2);
      background: linear-gradient(#1787d6 0%, #0f4f86 60%, #07365a 100%);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    .hint { font-size: 13px; opacity: 0.85; }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <div class="controls">
        <label>פרצוף דג 1 <input id="face1" type="file" accept="image/*" /></label>
        <label>פרצוף דג 2 <input id="face2" type="file" accept="image/*" /></label>
        <button id="restartBtn">התחל משחק חדש</button>
      </div>
      <div>
        <strong>ניקוד:</strong>
        <span id="score">0 : 0</span>
      </div>
    </section>

    <canvas id="game" width="960" height="540" aria-label="משחק דגים"></canvas>

    <section class="panel hint">
      שחקן שמאל: <strong>A / D</strong> | שחקן ימין: <strong>← / →</strong>.<br/>
      תפסו כמה שיותר אוכל לפני שהזמן נגמר!
    </section>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const restartBtn = document.getElementById('restartBtn');
    const faceInputs = [document.getElementById('face1'), document.getElementById('face2')];

    const keys = new Set();
    const fishes = [
      { x: 220, y: 250, w: 190, h: 120, speed: 5.2, color: '#ff8f1f', accent: '#fff', dir: 1, img: null, score: 0 },
      { x: 730, y: 290, w: 190, h: 120, speed: 5.2, color: '#2f75ff', accent: '#ffd550', dir: -1, img: null, score: 0 }
    ];

    let foods = [];
    let bubbles = [];
    let countdown = 60;
    let timerTick = 0;
    let running = true;

    function loadFace(file, idx) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const image = new Image();
        image.onload = () => {
          fishes[idx].img = image;
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    faceInputs.forEach((input, idx) => {
      input.addEventListener('change', (e) => loadFace(e.target.files[0], idx));
    });

    function spawnFood() {
      foods.push({
        x: 30 + Math.random() * (canvas.width - 60),
        y: -15,
        vy: 1.6 + Math.random() * 1.5,
        size: 7 + Math.random() * 6
      });
    }

    function spawnBubble() {
      bubbles.push({
        x: Math.random() * canvas.width,
        y: canvas.height + 10,
        r: 2 + Math.random() * 5,
        vy: 0.7 + Math.random() * 1.2,
        alpha: 0.2 + Math.random() * 0.5
      });
    }

    function drawFish(f) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.scale(f.dir, 1);

      ctx.fillStyle = f.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, f.w * 0.42, f.h * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = f.color;
      ctx.beginPath();
      ctx.moveTo(-f.w * 0.42, 0);
      ctx.lineTo(-f.w * 0.66, -f.h * 0.26);
      ctx.lineTo(-f.w * 0.66, f.h * 0.26);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = f.accent;
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(-f.w * 0.04, 0, f.h * 0.42, -1.2, 1.2);
      ctx.stroke();

      ctx.save();
      ctx.beginPath();
      ctx.arc(f.w * 0.12, 0, f.h * 0.28, 0, Math.PI * 2);
      ctx.clip();
      if (f.img) {
        ctx.drawImage(f.img, f.w * 0.12 - f.h * 0.33, -f.h * 0.33, f.h * 0.66, f.h * 0.66);
      } else {
        ctx.fillStyle = '#f7d8b0';
        ctx.fillRect(f.w * 0.12 - f.h * 0.33, -f.h * 0.33, f.h * 0.66, f.h * 0.66);
        ctx.fillStyle = '#1d1d1d';
        ctx.fillText('🙂', f.w * 0.12 - 10, 8);
      }
      ctx.restore();

      ctx.restore();
    }

    function drawFood(food) {
      ctx.fillStyle = '#f9c66a';
      ctx.beginPath();
      ctx.arc(food.x, food.y, food.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ddb15e';
      ctx.fillRect(food.x - 2, food.y - 1, 4, 2);
    }

    function update() {
      if (running) {
        if (keys.has('KeyA')) fishes[0].x -= fishes[0].speed;
        if (keys.has('KeyD')) fishes[0].x += fishes[0].speed;
        if (keys.has('ArrowLeft')) fishes[1].x -= fishes[1].speed;
        if (keys.has('ArrowRight')) fishes[1].x += fishes[1].speed;

        fishes.forEach(f => {
          f.x = Math.max(70, Math.min(canvas.width - 70, f.x));
          f.dir = (f === fishes[0]) ? 1 : -1;
        });

        if (Math.random() < 0.06) spawnFood();
        if (Math.random() < 0.25) spawnBubble();

        foods.forEach(food => food.y += food.vy);
        bubbles.forEach(b => b.y -= b.vy);

        foods = foods.filter(food => {
          let caught = false;
          fishes.forEach(f => {
            const mouthX = f.x + f.dir * 40;
            const mouthY = f.y;
            const dx = food.x - mouthX;
            const dy = food.y - mouthY;
            if (Math.hypot(dx, dy) < food.size + 28) {
              f.score += 1;
              caught = true;
            }
          });
          return !caught && food.y < canvas.height + 20;
        });

        bubbles = bubbles.filter(b => b.y > -20);

        timerTick += 1 / 60;
        if (timerTick >= 1) {
          countdown -= 1;
          timerTick = 0;
          if (countdown <= 0) running = false;
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      for (let i = 0; i < 20; i++) {
        ctx.fillRect(0, i * 28 + ((Date.now() / 40) % 28), canvas.width, 1);
      }

      bubbles.forEach(b => {
        ctx.strokeStyle = `rgba(255,255,255,${b.alpha})`;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.stroke();
      });

      foods.forEach(drawFood);
      fishes.forEach(drawFish);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText(`זמן: ${countdown}`, 20, 36);

      if (!running) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 42px sans-serif';
        const winner = fishes[0].score === fishes[1].score
          ? 'תיקו!'
          : fishes[0].score > fishes[1].score ? 'דג 1 ניצח! 🐠' : 'דג 2 ניצח! 🐟';
        ctx.fillText(winner, canvas.width / 2 - 120, canvas.height / 2 - 10);
        ctx.font = '24px sans-serif';
        ctx.fillText('לחצו "התחל משחק חדש" לסיבוב נוסף', canvas.width / 2 - 170, canvas.height / 2 + 35);
      }

      scoreEl.textContent = `${fishes[0].score} : ${fishes[1].score}`;
    }

    function frame() {
      update();
      render();
      requestAnimationFrame(frame);
    }

    function resetGame() {
      foods = [];
      bubbles = [];
      countdown = 60;
      timerTick = 0;
      running = true;
      fishes[0].x = 220;
      fishes[1].x = 730;
      fishes.forEach(f => f.score = 0);
    }

    window.addEventListener('keydown', (e) => keys.add(e.code));
    window.addEventListener('keyup', (e) => keys.delete(e.code));
    restartBtn.addEventListener('click', resetGame);

    frame();
  </script>
</body>
</html>
